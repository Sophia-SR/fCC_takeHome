<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Light-Bright</title><link rel="stylesheet" href="../styles.css"><style>
.palette{display:flex;flex-wrap:wrap;gap:10px}.swatch{height:38px;width:38px;padding:0;border-radius:50%;border:3px solid transparent}.swatch[aria-pressed="true"]{outline:2px solid white;outline-offset:2px}.board{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:4px;background:#070916;padding:12px;border:7px solid #343b6a;border-radius:16px;touch-action:none;user-select:none}.peg{aspect-ratio:1;border-radius:50%;background:#1f2238;border:1px solid #333b56;padding:0;min-width:0;min-height:0;box-shadow:inset 0 2px 4px #0009}.peg.lit{background:var(--light);box-shadow:0 0 9px var(--light),0 0 16px var(--light),inset 0 0 4px white;border-color:#fff8}.board button:hover{filter:none;outline:1px solid #8d9bd4}@media(max-width:620px){.board{gap:2px;padding:7px;border-width:4px}}
</style></head><body><main><a class="back" href="../">← All five projects</a><header><span class="eyebrow">01 · Click and drag to paint</span><h1>Light-Bright</h1><p>Choose a color and paint the pegs. Choose Eraser to turn individual lights off.</p></header><section class="card"><div class="toolbar"><div id="palette" class="palette" aria-label="Color palette"></div><button id="erase">Eraser</button><button id="random">Surprise me</button><button id="clear">Clear board</button></div><div id="board" class="board" role="group" aria-label="Color pegboard"></div><p id="status" role="status">Pick a color and create something bright.</p></section></main><script>
const colors=['#fc557a','#ffa84a','#ffe06e','#62dda9','#56b9ff','#ae89fb','#f5f5ff'];
const palette=document.querySelector('#palette');const board=document.querySelector('#board');const pegs=[];let chosen=colors[0];let drawing=false;
function select(color){chosen=color;palette.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.color===color)));document.querySelector('#erase').setAttribute('aria-pressed',String(color===null));}
for(const color of colors){const b=document.createElement('button');b.className='swatch';b.dataset.color=color;b.style.background=color;b.setAttribute('aria-label',`Paint ${color}`);b.addEventListener('click',()=>select(color));palette.append(b);}select(chosen);
for(let i=0;i<24*15;i++){const b=document.createElement('button');b.className='peg';b.type='button';b.setAttribute('aria-label',`Peg ${i+1}`);b.addEventListener('pointerdown',e=>{drawing=true;paint(b);e.preventDefault();});b.addEventListener('pointerenter',()=>{if(drawing)paint(b);});b.addEventListener('click',()=>paint(b));pegs.push(b);board.append(b);}
function paint(b){b.classList.toggle('lit',!!chosen);if(chosen)b.style.setProperty('--light',chosen);else b.style.removeProperty('--light');}
window.addEventListener('pointerup',()=>drawing=false);window.addEventListener('pointercancel',()=>drawing=false);
document.querySelector('#erase').addEventListener('click',()=>select(null));document.querySelector('#clear').addEventListener('click',()=>{pegs.forEach(b=>{b.classList.remove('lit');b.style.removeProperty('--light');});document.querySelector('#status').textContent='Board cleared.';});document.querySelector('#random').addEventListener('click',()=>{pegs.forEach(b=>{const color=Math.random()<.4?colors[Math.floor(Math.random()*colors.length)]:null;if(color){b.classList.add('lit');b.style.setProperty('--light',color);}else{b.classList.remove('lit');b.style.removeProperty('--light');}});document.querySelector('#status').textContent='A new colorful pattern!';});
</script></body></html>
