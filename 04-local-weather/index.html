<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Weather</title><link rel="stylesheet" href="../styles.css"><style>.weather{min-height:240px;display:flex;flex-direction:column;justify-content:center}.temp{font-size:clamp(60px,12vw,105px);font-weight:800;letter-spacing:-.09em;line-height:1.1;margin:10px 0}.conditions{font-size:20px;margin:0 0 16px}.meta{display:grid;grid-template-columns:repeat(2,minmax(100px,1fr));gap:12px}.meta>div{background:#111626;padding:14px;border-radius:12px}.meta strong{display:block;font-size:18px}</style></head><body><main><a class="back" href="../">← All five projects</a><header><span class="eyebrow">04 · Live weather</span><h1>Local Weather</h1><p>Use your current location (with permission) or search a city. Data: Open-Meteo.</p></header><div class="toolbar"><button class="primary" id="locate">Use my location</button><button id="units">Switch to °C</button></div><form class="toolbar" id="city-form"><input id="city" aria-label="City" placeholder="Or search a city" required><button type="submit">Find city</button></form><section id="weather" class="card weather"><span class="eyebrow" id="where">Weather report</span><div id="icon" style="font-size:50px" aria-hidden="true">☀️</div><div id="temp" class="temp">—</div><p id="description" class="conditions">Choose a location to start.</p><div class="meta"><div><small>Wind</small><strong id="wind">—</strong></div><div><small>Humidity</small><strong id="humidity">—</strong></div></div></section><p role="status" id="status">Location access works on HTTPS or localhost.</p></main><script>
const weatherMap=[[0,'Clear sky','☀️'],[1,'Mainly clear','🌤️'],[2,'Partly cloudy','⛅'],[3,'Overcast','☁️'],[45,'Fog','🌫️'],[48,'Fog','🌫️'],[51,'Drizzle','🌦️'],[53,'Drizzle','🌦️'],[55,'Drizzle','🌦️'],[61,'Rain','🌧️'],[63,'Rain','🌧️'],[65,'Heavy rain','🌧️'],[71,'Snow','❄️'],[73,'Snow','❄️'],[75,'Heavy snow','❄️'],[80,'Showers','🌦️'],[81,'Showers','🌦️'],[82,'Heavy showers','🌧️'],[95,'Thunderstorm','⛈️'],[96,'Thunderstorm','⛈️'],[99,'Thunderstorm','⛈️']];let latest=null;let fahrenheit=true;
const $=sel=>document.querySelector(sel);function report(message){$('#status').textContent=message;}
function display(){if(!latest)return;const w=latest.current;const [_,desc,icon]=weatherMap.find(row=>row[0]===w.weather_code)||[0,'Conditions unavailable','🌤️'];$('#where').textContent=latest.name;$('#icon').textContent=icon;$('#temp').textContent=Math.round(fahrenheit?(w.temperature_2m*9/5+32):w.temperature_2m)+(fahrenheit?'°F':'°C');$('#description').textContent=desc;$('#wind').textContent=Math.round(w.wind_speed_10m)+' km/h';$('#humidity').textContent=w.relative_humidity_2m+'%';$('#units').textContent=fahrenheit?'Switch to °C':'Switch to °F';document.body.style.background=w.weather_code>=51?'radial-gradient(circle at top left,#233951,#11131b 58%)':'radial-gradient(circle at top left,#4d3b53,#11131b 58%)';}
async function loadWeather(lat,lon,name){report('Loading live weather…');try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&temperature_unit=celsius&timezone=auto`;const response=await fetch(url);if(!response.ok)throw new Error('Weather API unavailable');const data=await response.json();if(!data.current)throw new Error('Weather data missing');latest={current:data.current,name};display();report(`Updated: ${data.current.time.replace('T',' ')} (local time)`);}catch(err){report('Could not load weather. Try again.');console.error(err);}}
$('#locate').addEventListener('click',()=>{if(!navigator.geolocation){report('Geolocation is unavailable. Use city search.');return;}report('Requesting browser location permission…');navigator.geolocation.getCurrentPosition(pos=>loadWeather(pos.coords.latitude,pos.coords.longitude,'Your current location'),err=>report('Location not available. Search by city instead.'),{enableHighAccuracy:false,timeout:12000});});
$('#city-form').addEventListener('submit',async e=>{e.preventDefault();const name=$('#city').value.trim();if(!name)return;report('Finding city…');try{const response=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=en&format=json`);if(!response.ok)throw new Error('Geocoding failed');const data=await response.json();if(!data.results?.length){report('City not found. Try another name.');return;}const city=data.results[0];await loadWeather(city.latitude,city.longitude,`${city.name}, ${city.country}`);}catch(err){report('City lookup failed. Try again.');console.error(err);}});
$('#units').addEventListener('click',()=>{fahrenheit=!fahrenheit;display();});
</script></body></html>
