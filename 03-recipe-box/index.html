<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recipe Box</title><link rel="stylesheet" href="../styles.css"><style>.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.recipe h2{margin:0 0 5px}.recipe ul{padding-left:20px;color:#d3d8e8}.recipe ul li{padding-bottom:4px}.recipe .meta{font-size:12px;color:#9caafc}.form-fields{display:grid;gap:14px;margin:12px 0}.form-fields label{display:grid;gap:7px;font-size:14px;font-weight:650}.hidden{display:none!important}.empty{padding:35px;text-align:center}</style></head><body><main><a class="back" href="../">← All five projects</a><header><span class="eyebrow">03 · Create, read, update, delete</span><h1>Recipe Box</h1><p>Your recipes are saved in this browser using localStorage.</p></header><div class="toolbar"><button class="primary" id="new">+ Add recipe</button><button id="reset">Restore sample recipes</button><span id="count" class="muted"></span></div><section id="editor" class="card hidden" aria-label="Recipe editor"><h2 id="form-title">Add recipe</h2><form id="recipe-form"><div class="form-fields"><label>Recipe title<input id="name" required maxlength="90" placeholder="e.g. Mango Salsa"></label><label>Ingredients (one per line)<textarea id="ingredients" required rows="5" placeholder="Mango\nLime\nCilantro"></textarea></label><label>Instructions<textarea id="instructions" required rows="4" placeholder="Step-by-step cooking instructions"></textarea></label></div><div class="row"><button class="primary" type="submit">Save recipe</button><button type="button" id="cancel">Cancel</button></div></form></section><section class="recipes" id="recipes" aria-label="Saved recipes"></section><p id="status" role="status"></p></main><script>
const KEY='fcc-recipe-box-v1';const samples=[{id:1,name:'Mango Salsa',ingredients:['1 ripe mango','1 lime','A handful of cilantro','Pinch of salt'],instructions:'Dice the mango. Chop the cilantro. Mix with lime juice and salt.'},{id:2,name:'Cinnamon Oatmeal',ingredients:['1 cup oats','2 cups water or milk','1 tsp cinnamon','Berries'],instructions:'Simmer oats until creamy, stir in cinnamon, and top with berries.'}];let recipes;try{const saved=JSON.parse(localStorage.getItem(KEY));recipes=Array.isArray(saved)?saved:samples;}catch{recipes=samples;}let editing=null;
const list=document.querySelector('#recipes'),editor=document.querySelector('#editor'),form=document.querySelector('#recipe-form');
function save(){try{localStorage.setItem(KEY,JSON.stringify(recipes));}catch(e){document.querySelector('#status').textContent='Browser storage unavailable. Changes may not persist.';}render();}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el;}
function render(){list.replaceChildren();document.querySelector('#count').textContent=`${recipes.length} saved recipe${recipes.length===1?'':'s'}`;if(!recipes.length){list.append(node('p','No recipes yet. Add your first recipe!'));return;}for(const recipe of recipes){const card=document.createElement('article');card.className='card recipe';card.append(node('h2',recipe.name),node('p','Ingredients'));const ul=document.createElement('ul');for(const ingredient of recipe.ingredients)ul.append(node('li',ingredient));card.append(ul,node('p',recipe.instructions));const actions=document.createElement('div');actions.className='row';const edit=node('button','Edit');const del=node('button','Delete');edit.addEventListener('click',()=>showForm(recipe));del.addEventListener('click',()=>{if(confirm(`Delete “${recipe.name}”?`)){recipes=recipes.filter(r=>r.id!==recipe.id);save();}});actions.append(edit,del);card.append(actions);list.append(card);}}
function showForm(recipe){editing=recipe?recipe.id:null;document.querySelector('#form-title').textContent=recipe?'Edit recipe':'Add recipe';document.querySelector('#name').value=recipe?.name||'';document.querySelector('#ingredients').value=recipe?.ingredients.join('\n')||'';document.querySelector('#instructions').value=recipe?.instructions||'';editor.classList.remove('hidden');document.querySelector('#name').focus();}
function closeForm(){editor.classList.add('hidden');form.reset();editing=null;}
form.addEventListener('submit',event=>{event.preventDefault();const item={id:editing??Date.now(),name:document.querySelector('#name').value.trim(),ingredients:document.querySelector('#ingredients').value.split('\n').map(s=>s.trim()).filter(Boolean),instructions:document.querySelector('#instructions').value.trim()};if(!item.name||!item.ingredients.length||!item.instructions)return;if(editing!==null){const idx=recipes.findIndex(r=>r.id===editing);if(idx!==-1)recipes[idx]=item;}else recipes.push(item);save();closeForm();});
document.querySelector('#new').addEventListener('click',()=>showForm());document.querySelector('#cancel').addEventListener('click',closeForm);document.querySelector('#reset').addEventListener('click',()=>{if(confirm('Replace your saved recipes with samples?')){recipes=samples.map(r=>({...r,ingredients:[...r.ingredients]}));save();closeForm();}});render();
</script></body></html>
