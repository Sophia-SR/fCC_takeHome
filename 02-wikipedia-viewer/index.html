<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wikipedia Viewer</title><link rel="stylesheet" href="../styles.css"><style>.search{display:flex;gap:10px;margin:22px 0}.search input{flex:1;min-width:0}.results{display:grid;gap:12px}.result{display:block;text-decoration:none;color:inherit}.result:hover{border-color:#8896e7}.result h2{margin:0 0 6px;color:#dddfff}.result p{margin:0}.result small{display:block;margin-top:8px;color:#a2afff}</style></head><body><main><a class="back" href="../">← All five projects</a><header><span class="eyebrow">02 · Wikipedia API</span><h1>Wikipedia Viewer</h1><p>Search for articles or discover a random topic.</p></header><form class="search" id="search"><input id="query" name="search" placeholder="Search Wikipedia…" required aria-label="Wikipedia search term"><button class="primary" type="submit">Search</button></form><div class="toolbar"><a class="btn" href="https://en.wikipedia.org/wiki/Special:Random" target="_blank" rel="noopener noreferrer">Surprise me · random article</a></div><p id="status" role="status">Type a topic to find Wikipedia articles.</p><section id="results" class="results" aria-label="Search results"></section></main><script>
const form=document.querySelector('#search'),results=document.querySelector('#results'),status=document.querySelector('#status');let pending;
function cleanText(html){const node=document.createElement('div');node.innerHTML=html;return node.textContent||'';}
async function searchWikipedia(query){status.textContent='Searching…';results.replaceChildren();try{const url=new URL('https://en.wikipedia.org/w/api.php');url.search=new URLSearchParams({action:'query',list:'search',srsearch:query,srlimit:'10',format:'json',origin:'*'}).toString();const response=await fetch(url);if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();const items=data.query?.search||[];status.textContent=items.length?`${items.length} articles found for “${query}”`:'No matches found.';for(const item of items){const link=document.createElement('a');link.className='card result';link.href='https://en.wikipedia.org/?curid='+encodeURIComponent(item.pageid);link.target='_blank';link.rel='noopener noreferrer';const h2=document.createElement('h2');h2.textContent=item.title;const p=document.createElement('p');p.textContent=cleanText(item.snippet);const small=document.createElement('small');small.textContent='Read article ↗';link.append(h2,p,small);results.append(link);}}catch(error){status.textContent='Wikipedia search failed. Check your connection and try again.';console.error(error);}}
form.addEventListener('submit',e=>{e.preventDefault();const query=document.querySelector('#query').value.trim();if(query)searchWikipedia(query);});
</script></body></html>
