<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tic Tac Toe</title><link rel="stylesheet" href="../styles.css"><style>.game{max-width:580px;margin:0 auto}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px auto;max-width:390px}.cell{font-size:clamp(44px,9vw,68px);aspect-ratio:1;border-radius:14px;background:#141a2c;border:2px solid #49506c;padding:0;font-weight:850}.cell.x{color:#86b0ff}.cell.o{color:#ffb78b}.cell:hover:enabled{background:#303956}.score{display:flex;justify-content:center;gap:26px;color:#cad0e5}.score strong{color:white}.center{text-align:center}.choice[aria-pressed=true]{background:#747fe1;color:#11162b;border-color:#747fe1;font-weight:800}</style></head><body><main><a class="back" href="../">← All five projects</a><header class="center"><span class="eyebrow">05 · Player vs computer</span><h1>Tic Tac Toe</h1><p>Choose your mark and play. The board automatically resets after each game.</p></header><section class="card game"><div class="toolbar" style="justify-content:center"><span>Play as:</span><button class="choice" data-mark="X" aria-pressed="true">X</button><button class="choice" data-mark="O" aria-pressed="false">O</button><button id="reset">New game</button></div><h2 class="center" id="status" role="status">Your turn (X)</h2><div class="board" id="board" role="group" aria-label="Tic Tac Toe board"></div><div class="score"><span>You: <strong id="wins">0</strong></span><span>Computer: <strong id="losses">0</strong></span><span>Ties: <strong id="ties">0</strong></span></div></section></main><script>
const combos=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];const boardElement=document.querySelector('#board'),status=document.querySelector('#status');let player='X',computer='O',board=Array(9).fill(''),locked=false,resetTimer=null,aiTimer=null;const cells=[];const score={wins:0,losses:0,ties:0};
for(let i=0;i<9;i++){const cell=document.createElement('button');cell.type='button';cell.className='cell';cell.setAttribute('aria-label',`Row ${Math.floor(i/3)+1}, column ${(i%3)+1}`);cell.addEventListener('click',()=>move(i));boardElement.append(cell);cells.push(cell);}
function winner(b){for(const [a,c,d] of combos)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.every(Boolean)?'tie':null;}
function draw(){cells.forEach((cell,i)=>{cell.textContent=board[i];cell.className='cell '+board[i].toLowerCase();cell.disabled=locked||!!board[i];});}
function finish(result){locked=true;draw();if(result==='tie'){score.ties++;status.textContent="It's a tie! New round shortly.";}else if(result===player){score.wins++;status.textContent='You win! New round shortly.';}else{score.losses++;status.textContent='Computer wins! New round shortly.';}for(const key of Object.keys(score))document.getElementById(key).textContent=score[key];resetTimer=setTimeout(start,1550);}
function move(i){if(locked||board[i])return;board[i]=player;draw();const outcome=winner(board);if(outcome){finish(outcome);return;}locked=true;status.textContent='Computer thinking…';draw();aiTimer=setTimeout(computerMove,350);}
function bestComputerMove(){const open=board.map((m,i)=>m=== ''?i:-1).filter(i=>i>=0);for(const mark of [computer,player])for(const i of open){const test=[...board];test[i]=mark;if(winner(test)===mark)return i;}if(open.includes(4))return 4;const corners=open.filter(i=>[0,2,6,8].includes(i));if(corners.length)return corners[Math.floor(Math.random()*corners.length)];return open[0];}
function computerMove(){aiTimer=null;const next=bestComputerMove();if(next===undefined||next===null){return;}board[next]=computer;const outcome=winner(board);if(outcome){finish(outcome);return;}locked=false;status.textContent=`Your turn (${player})`;draw();}
function start(){clearTimeout(resetTimer);clearTimeout(aiTimer);resetTimer=null;aiTimer=null;board=Array(9).fill('');locked=player==='O';status.textContent=locked?'Computer starts (X)':`Your turn (${player})`;draw();if(locked)aiTimer=setTimeout(computerMove,350);}
for(const button of document.querySelectorAll('.choice'))button.addEventListener('click',()=>{player=button.dataset.mark;computer=player==='X'?'O':'X';document.querySelectorAll('.choice').forEach(btn=>btn.setAttribute('aria-pressed',String(btn===button)));start();});document.querySelector('#reset').addEventListener('click',start);start();
</script></body></html>
